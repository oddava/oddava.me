name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: oddava-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          eval "$(ssh-agent -s)"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
            printf '%s\n%s\n' '#!/usr/bin/env bash' 'printf "%s\n" "$VPS_SSH_PASSPHRASE"' > ~/.ssh/askpass.sh
            chmod 700 ~/.ssh/askpass.sh
            DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/askpass.sh" SSH_ASKPASS_REQUIRE=force setsid ssh-add ~/.ssh/id_ed25519 < /dev/null
            rm -f ~/.ssh/askpass.sh
          else
            ssh-add ~/.ssh/id_ed25519
          fi

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -eu
          ssh -o IdentitiesOnly=yes -p "${VPS_SSH_PORT:-22}" "${VPS_USER}@${VPS_HOST}" <<EOF
          set -eu
          cd "${VPS_APP_DIR}"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          docker compose up -d --build --remove-orphans
          EOF
