name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a main-branch run: it ends in a
  # wrangler deploy, and cancelling mid-deploy leaves a verified commit that was
  # never shipped, with no failure signal beyond a cancelled run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run check
      - run: pnpm run test
        env:
          RUN_REDIS_INTEGRATION: '1'
      # Chromium is cached per Playwright version; its system libraries are
      # not, since apt installs them outside the cache path.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
      - run: pnpm run build
        env:
          # Step 1.5: the garden lives on its own origin. Read at build time
          # (prerendered pages and islands bake it in), so it belongs here, not
          # in the Worker's dashboard variables. Unset, notes stay on the apex.
          PUBLIC_NOTES_BASE: https://notes.oddava.me
      # Not `pnpm audit`: it calls npm's quick-audit endpoint, which npm retired
      # and now answers 410 on every request. Every pnpm version does this, so
      # there is no release to upgrade to. `--ignore-registry-errors` would turn
      # this green by treating that 410 as a pass, which is a gate that audits
      # nothing. osv-scanner reads pnpm-lock.yaml against the OSV database and
      # still fails the build on a real vulnerability.
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml
      - run: pnpm exec wrangler deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
