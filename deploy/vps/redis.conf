# This store is the only copy of the live notes between `notes:export` runs, so
# it is configured for durability first.

# AOF: every write is logged and fsynced once a second (lose at most ~1s).
appendonly yes
appendfsync everysec

# RDB snapshots too — a single file that is easy to copy off the box.
save 900 1
save 300 10
save 60 10000
dir /data

# Never evict. An evicted note key is silent data loss; a full store should
# fail writes loudly instead. Raise the cap if the VPS has room.
maxmemory 512mb
maxmemory-policy noeviction

# Only reachable on the compose network and host loopback.
protected-mode yes
bind 0.0.0.0
