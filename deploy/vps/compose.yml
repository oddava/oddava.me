# Production storage on a self-hosted VPS: Redis behind an Upstash-compatible
# REST bridge, and RustFS for S3-compatible object storage, both reached
# through a Cloudflare Tunnel.
#
#   Worker ──https──▶ Cloudflare edge ──tunnel──▶ cloudflared ─▶ srh ─▶ redis
#   S3 client ─https─▶ Cloudflare edge ──tunnel──▶ cloudflared ─▶ rustfs:9000
#
# Nothing here listens on a public interface: the tunnel dials out, and Redis
# and the RustFS console are published on loopback only (reach them with
# `ssh -L`). See README.md.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '/usr/local/etc/redis/redis.conf',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}',
      ]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Speaks the Upstash REST protocol the Worker already uses
  # (`POST /` with a JSON command array and a Bearer token), so the app only
  # needs new UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN secrets.
  srh:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN:?set SRH_TOKEN in .env}
      SRH_CONNECTION_STRING: redis://:${REDIS_PASSWORD}@redis:6379

  # S3-compatible object storage. The API (9000) is public through the tunnel
  # and every request must be SigV4-signed; the console (9001) is never routed
  # through the tunnel — open it with `ssh -L 19001:127.0.0.1:9001`. Both are
  # also on loopback so admin tools can skip Cloudflare via `ssh -L` (see
  # README: the AWS CLI signs headers Cloudflare may rewrite).
  # Runs as 10001:10001, which owns /data and /logs in the image, so the named
  # volumes inherit the right ownership on first start.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/health >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - srh
      - rustfs
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}

volumes:
  redis-data:
  rustfs-data:
  rustfs-logs:
